<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星际猎人 · 《星汉》《斗志昂扬》军团</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f33 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1.5rem;
        }

        /* ===== 卡片容器 ===== */
        .card {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 3.5rem 3rem;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 70px -20px rgba(0, 0, 0, 0.9);
        }

        /* ===== 装饰光点 ===== */
        .glow-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 20px #fbbf24aa;
            margin-bottom: 1.5rem;
        }

        /* ===== 主标题 ===== */
        .title {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .title .highlight {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            text-decoration: none;
        }

        .title .highlight:hover {
            filter: brightness(1.1);
        }

        .sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3px;
            margin-bottom: 2.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 1.5rem;
        }

        /* ===== 入口卡片（统一） ===== */
        .entry-wrapper {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 2rem;
            padding: 1.5rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.2s, border-color 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .entry-wrapper:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .entry-label {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            margin-bottom: 0.6rem;
        }

        /* ===== QQ群入口专用 ===== */
        .qq-wrapper {
            border-color: rgba(18, 183, 245, 0.15);
        }

        .qq-wrapper:hover {
            border-color: rgba(18, 183, 245, 0.35);
            background: rgba(18, 183, 245, 0.06);
        }

        .qq-wrapper .entry-label {
            color: rgba(18, 183, 245, 0.6);
        }

        /* ===== 链接样式 ===== */
        .qq-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            font-size: 1.2rem;
            font-weight: 500;
            color: #6ec8f5;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s, transform 0.2s;
            margin: 0 auto;
            line-height: 1;
        }

        .qq-link:hover {
            color: #8fd8ff;
            border-bottom-color: rgba(18, 183, 245, 0.5);
            transform: scale(1.02);
        }

        .qq-link:active {
            color: #4ab0e0;
        }

        /* 自定义图标样式（替代加载失败的外部图） */
        .qq-icon {
            font-size: 1.8rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }

        .qq-link:hover .qq-icon {
            transform: rotate(-4deg) scale(1.05);
        }

        .qq-group-name {
            font-weight: 500;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #6ec8f5, #3ba9e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 2.2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            text-align: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 2rem;
            }
            .title {
                font-size: 1.8rem;
            }
            .qq-link {
                font-size: 1rem;
            }
            .entry-wrapper {
                padding: 1.2rem 1.2rem;
            }
            .qq-icon {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 2rem 1rem;
            }
            .title {
                font-size: 1.5rem;
            }
            .qq-link {
                gap: 0.4rem;
                flex-wrap: wrap;
            }
            .qq-icon {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="glow-dot"></span>

        <h1 class="title">
            星际猎人<br />
            <a href="https://www.zhixi.com/view/ae25547d" target="_blank" rel="noopener noreferrer" class="highlight">
                《星汉》<br />
                《斗志昂扬》军团
            </a>
        </h1>
        <p class="sub">— 官网直达 —</p>

        <!-- ===== QQ群入口 ===== -->
        <div class="entry-wrapper qq-wrapper">
            <span class="entry-label">▼ 喝杯茶交流下</span>
            <a target="_blank"
               href="https://qm.qq.com/cgi-bin/qm/qr?k=q8YdmpfNH6xLdbhWJplhTgGPuSWeVSf6&jump_from=webapi&authKey=4S/TecH+FeUgzkpXZHgBKUdmlBZklEZDbXwXZVMrQe+iwjAWaKEV7YlEJtgEcvmK"
               class="qq-link"
               rel="noopener noreferrer">
                <!-- 移除了失效的外部图片，改用 Emoji 图标 -->
                <span class="qq-icon">🍵</span>
                <span class="qq-group-name">相识-从容</span>
            </a>
        </div>

        <div class="footer-note">
            · 星际猎人 · 《斗志昂扬》军团 ·
        </div>
    </div>

</body>
</html>
